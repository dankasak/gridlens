set_deferrable_schedule:
  name: Set Deferrable Load Weekly Schedule
  description: >
    Save a deferrable load's weekly availability schedule — 7 day rows (Monday first),
    each with 48 half-hour values (or 24 hourly values, which expand to half-hours)
    where 1 means the device is allowed to run in that local half-hour. A saved
    schedule replaces the static availability-hours setting from the integration
    config for that device. Normally called by the Grid Lens schedule card.
  fields:
    sensor_id:
      name: Device energy sensor
      description: The deferrable device's configured energy sensor entity id (its canonical key).
      required: true
      example: "sensor.ev_charger_energy"
      selector:
        text:
    days:
      name: Weekly grid
      description: 7 lists (Monday first) of 48 half-hour values (0 = blocked, 1 = allowed).
      required: true
      selector:
        object:

clear_deferrable_schedule:
  name: Clear Deferrable Load Weekly Schedule
  description: >
    Remove a deferrable load's saved weekly schedule so it reverts to the static
    availability-hours setting from the integration config.
  fields:
    sensor_id:
      name: Device energy sensor
      description: The deferrable device's configured energy sensor entity id.
      required: true
      example: "sensor.ev_charger_energy"
      selector:
        text:

set_charge_target:
  name: Set Ad-Hoc Charge Target
  description: >
    Set a one-off "charge to X% by a datetime" target on an SOC-tracked deferrable
    load (e.g. an EV) — "100% by 7am Saturday" before a trip. The optimizer still
    chooses the cheapest slots between now and the deadline, only forcing full-power
    charging if it must to guarantee the target is met in time. Auto-clears itself
    once the live SOC reaches the target or the deadline passes — no need to clear it
    manually after use. Equivalent to setting the device's charge-target percent and
    datetime entities by hand; only works on a device with an SOC sensor + capacity
    configured (integration reconfigure options).
  fields:
    sensor_id:
      name: Device energy sensor
      description: The deferrable device's configured energy sensor entity id (its canonical key).
      required: true
      example: "sensor.ev_charger_energy"
      selector:
        text:
    target_percent:
      name: Target percent
      description: The SOC percent to reach by target_datetime (0-100).
      required: true
      example: 100
      selector:
        number:
          min: 1
          max: 100
          unit_of_measurement: "%"
    target_datetime:
      name: Target datetime
      description: When the device must have reached target_percent.
      required: true
      example: "2026-09-20 07:00:00"
      selector:
        datetime:

clear_charge_target:
  name: Clear Ad-Hoc Charge Target
  description: Cancel a deferrable load's ad-hoc charge target, if one is set.
  fields:
    sensor_id:
      name: Device energy sensor
      description: The deferrable device's configured energy sensor entity id.
      required: true
      example: "sensor.ev_charger_energy"
      selector:
        text:

set_daily_target:
  name: Set Daily Target
  description: >
    Pin a deferrable load (or "master", which applies to every device with no
    explicit override of its own) to a percent-of-average daily kWh target —
    e.g. 50% to skip most of the EV's usual charge on a rainy day, or 150% to
    top it up more than usual. Takes effect from the next advisory tick and
    applies to every day in the rolling horizon, not a single date — set it in
    the morning and it caps what's left of today too, not just future days.
    Unlike Today Boost, 0% is a legitimate explicit value (skip the device
    entirely), so this always pins the device; use clear_daily_target to unpin
    it back to following the master. Values above 100% are allowed. Persists
    until explicitly cleared (or the master is set back to 100) — it does not
    auto-revert at midnight, since the advisory plan may already be relying on
    it for a still-future slot.
  fields:
    sensor_id:
      name: Device energy sensor (or "master")
      description: >
        The deferrable device's configured energy sensor entity id, or the
        literal string "master" to set the all-devices default.
      required: true
      example: "sensor.ev_charger_energy"
      selector:
        text:
    percent:
      name: Target percent
      description: Percent of the device's (or master's) usual average daily kWh.
      required: true
      example: 50
      selector:
        number:
          min: 0
          max: 300
          unit_of_measurement: "%"

clear_daily_target:
  name: Clear Daily Target
  description: >
    Unpin a deferrable load's Daily Target so it goes back to following the
    master percent. Not valid for "master" itself — set that back to 100
    with set_daily_target instead.
  fields:
    sensor_id:
      name: Device energy sensor
      description: The deferrable device's configured energy sensor entity id.
      required: true
      example: "sensor.ev_charger_energy"
      selector:
        text:

calculate_period:
  name: Calculate Plan Data for Period (deprecated)
  description: Deprecated and non-functional - calling this raises an error. Use the Grid Lens dashboard for plan comparisons. The per-hour sensor population this used to do was removed; the service is kept only so existing automations fail loudly rather than silently vanish.
  fields:
    start_date:
      name: Start Date
      description: Beginning of calculation period (YYYY-MM-DD or YYYY-MM-DD HH:MM:SS)
      required: true
      example: "2026-01-01"
      selector:
        text:
    end_date:
      name: End Date
      description: End of calculation period (YYYY-MM-DD or YYYY-MM-DD HH:MM:SS)
      required: true
      example: "2026-01-31"
      selector:
        text:
